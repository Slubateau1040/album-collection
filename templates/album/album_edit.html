{% extends 'base.html' %}

{% block content %}

    <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

        <label for="album_name">Album Name</label>
        <input type="text" name="album_name" id="album_name" value="{{album.album_name}}" required>

        <label for="artist">Artist</label>
        <select name="artist" id="artist">
            {% for artist in artists %}
                <option value="{{artist.id}}" {% if artist.id == album.artist.id %}selected{% endif %} >{{artist.artist_name}}</option>
            {% endfor %}
        </select>

        <label for="cover">Cover</label>
        <input type="file" name="cover" id="cover">

        <label for="date">Date</label>
        <input type="date" name="date" id="date" value="{{album.date|date:'Y-m-d'}}" required>

        <button type="submit">Submit</button>

    </form>
{% endblock %}
