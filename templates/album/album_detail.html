{% extends 'base.html' %}

{% block content %}

    <h1>{{ album.album_name }}</h1>
    <p>{{ album.artist.artist_name }}</p>
    <p>{{ album.date }}</p>
    <img src="{{ album.cover.url }}" alt="{{ album.album_name }}">


    <form action="{% url 'album_delete' album.id %}" method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    </form>

    <a href="{% url 'album_edit' album.id %}">Edit</a>

{% endblock %}
