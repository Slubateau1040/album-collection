{% extends 'base.html' %}

{% block content %}

    <h1>Artists</h1>

    <ul>
    {% for artist in artists %}
    	<li>{{ artist.artist_name }}</li>
        <form action="{% url 'artist_delete' artist.id %}" method="post">
        {% csrf_token %}
            <input type="submit" value="Delete">
        </form>
    {% endfor %}
    </ul>

    <a href="{% url 'album_list' %}">Return to Album List</a>

{% endblock %}
